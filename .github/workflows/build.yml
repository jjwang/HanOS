name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential nasm xorriso mtools gdisk e2fsprogs \
            qemu-system-x86 socat perl curl git
          # The kernel and userspace build with a bare-metal target name.
          # The runner ships a host x86-64 GCC; disable PIE to match the
          # freestanding link flags.
          sudo tee /usr/local/bin/x86_64-elf-gcc >/dev/null <<'WRAP'
          #!/bin/sh
          exec gcc -fno-pie "$@"
          WRAP
          sudo chmod +x /usr/local/bin/x86_64-elf-gcc
          sudo ln -sf "$(command -v ar)" /usr/local/bin/x86_64-elf-ar
          sudo ln -sf "$(command -v ranlib)" /usr/local/bin/x86_64-elf-ranlib

      - name: Build kernel
        run: make -C kernel

      - name: Build userspace
        run: make -C userspace

      - name: Build ISO
        run: make

      - name: Test artifacts
        run: ./scripts/ci-artifacts-test.sh

      - name: Boot test
        run: |
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            ACCEL=kvm
            CPU=host
          else
            ACCEL=tcg
            CPU=max
          fi
          HANOS_QEMU_ACCEL="$ACCEL" HANOS_QEMU_CPU="$CPU" \
            ./scripts/ci-boot-test.sh
