on: [push]
name: Generate LoC badge

jobs:
  hanos_loc_counter_job:
    runs-on: ubuntu-latest
    name: Generate LoC badge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate LoC Badge
        id: badge
        uses: shadowmoose/GHA-LoC-Badge@1.0.0
        with:
          debug: true
          directory: ./
          badge: ./output/badge.svg
          ignore: '.git/|.github/|doc/|attic/|release/|screenshot/|sysroot/|manual.pdf|README.md|README.zh-cn.md|LICENSE|Doxyfile'

      - name: Generate Kernel LoC Badge
        id: kernel_badge
        uses: shadowmoose/GHA-LoC-Badge@1.0.0
        with:
          debug: true
          directory: ./kernel
          badge: ./output/kernel-badge.svg
          badge_label: 'Kernel Lines of Code'
          ignore: '3rd-party/**|kernel/3rd-party/**'

      - name: Print the output
        run: |
          echo "Scanned: ${{ steps.badge.outputs.counted_files }}";
          echo "Line Count: ${{ steps.badge.outputs.total_lines }}";
          echo "Kernel Scanned: ${{ steps.kernel_badge.outputs.counted_files }}";
          echo "Kernel Line Count: ${{ steps.kernel_badge.outputs.total_lines }}";

      - name: Deploy to image-data branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          publish_dir: ./output
          publish_branch: image-data
          github_token: ${{ secrets.GITHUB_TOKEN }}
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

